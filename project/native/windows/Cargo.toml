[package]
name = "zcode-antigravity-tauri"
version = "0.6.4-test"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
ureq = { version = "3.4.0", default-features = false, features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
